defaults:
  - _self_
  - task: lift_image_abs

name: train_diffusion_unet_image
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace_task_aware_loss.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
    clip_sample: True # required when predict_epsilon=False
    prediction_type: epsilon # or sample

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
      in_channels: ${task.in_channels}
    crop_shape: [76, 76]
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  # crop_shape: null
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # scheduler.step params
  # predict_epsilon: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False

  lr_scheduler: reduce_on_plateau

  # val_task_score 連續 3 次沒有改善後，LR × 0.1
  lr_reduce_factor: 0.1
  # PyTorch patience=2 means reduce on the 3rd consecutive non-improving validation.
  lr_reduce_patience: 2
  lr_reduce_threshold: 1.0e-4
  lr_reduce_cooldown: 0
  min_lr: 1.0e-7

  # ReduceLROnPlateau 不使用 warmup
  lr_warmup_steps: 0

  num_epochs: 8000
  gradient_accumulate_every: 1

  use_ema: True
  freeze_encoder: False

  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5  # 保留相容性；task metrics 會在每次 validation 計算

  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

  # ------------------------------------------------------------
  # Task-aware training loss
  #
  # total_loss =
  #   noise_weight * diffusion_noise_MSE
  #   + position_weight * reconstructed_x0_position_MSE
  #   + orientation_weight * reconstructed_x0_orientation_MSE
  #   + gripper_weight * reconstructed_x0_gripper_MSE
  #
  # Auxiliary action losses are calculated in NORMALIZED action space
  # and DO participate in backpropagation / weight updates.
  # ------------------------------------------------------------
  task_loss_noise_weight: 1.0
  task_loss_position_weight: 0.5
  task_loss_orientation_weight: 0.2
  task_loss_gripper_weight: 0.2

  # Only apply x0 auxiliary loss to lower-noise DDPM timesteps.
  # Scheduler has 100 steps (0~99); 50 is a stable starting point.
  task_loss_max_timestep: 50

  # Scheduler / Early Stopping / best.ckpt 共同監控的指標
  monitor_key: val_task_score

  # Dimensionless task score:
  # position_weight * (position_MAE_mm / position_scale_mm)
  # + orientation_weight * (orientation_MAE_deg / orientation_scale_deg)
  # + gripper_weight * (gripper_MAE_deg / gripper_scale_deg)
  task_score_position_weight: 1.0
  task_score_orientation_weight: 1.0
  task_score_gripper_weight: 1.0
  task_score_position_scale_mm: 20.0
  task_score_orientation_scale_deg: 15.0
  task_score_gripper_scale_deg: 3.0

  # Early Stopping based on monitor_key
  early_stopping: True
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-3

  # Maximum number of validation batches used for task-space action metrics.
  # Set to null to evaluate the entire validation set.
  max_action_eval_steps: 5

logging:
  project: diffusion_policy_debug
  resume: True
  mode: disabled
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_task_score
    mode: min
    k: 1
    format_str: 'best.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
